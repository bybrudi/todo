<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="투두">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>투두</title>
<style>
:root{
  --bg:#ffffff;
  --ink:#222222;
  --ink2:#6f6f6f;
  --ink3:#a8a8a8;
  --line:#ececec;
  --soft:#f3f3f3;
  --band:#eeeeee;
  --dark:#2a2a2a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-weight:400;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
ul{list-style:none;margin:0;padding:0}

.app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 44px) 26px calc(env(safe-area-inset-bottom,0px) + 24px)}

/* 상단 */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.ht{display:flex;align-items:baseline;gap:8px;min-width:0}
.ht b{font-size:17px;font-weight:600;letter-spacing:-.2px}
.ht span{font-size:15px;color:var(--ink2)}
.nav{display:flex;align-items:center;gap:2px}
.nav .txt{font-size:13px;color:var(--ink2);padding:6px 8px}
.nav .ar{width:34px;height:34px;display:grid;place-items:center;color:var(--ink2)}

/* 캘린더 */
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12.5px;color:var(--ink3);margin-bottom:8px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);margin:0 -10px;padding:0 10px;border-radius:999px}
.wk.on{background:var(--band)}
.d{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;color:var(--ink)}
.d:disabled{cursor:default}
.d .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.d.is-today .n{font-weight:700}
.d.sel .n{background:var(--dark);color:#fff;font-weight:600}
.d .dot{width:3px;height:3px;border-radius:50%;margin-top:2px;background:transparent}
.d.has .dot{background:var(--ink3)}

/* 오늘 */
.today{margin-top:26px}
.th{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}
.th h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.4px}
.plus{width:38px;height:38px;display:grid;place-items:center;margin-right:-8px;color:var(--ink)}

.row{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.delbtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:52px;height:44px;
  border:1px solid #c4c4c4;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--ink2)}
.card{position:relative;background:#fff;display:flex;gap:14px;align-items:flex-start;padding:16px 0;
  transition:transform .22s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ico{flex:none;width:26px;height:26px;display:grid;place-items:center;color:var(--ink2)}
.body{flex:1;min-width:0;cursor:pointer}
.body small{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:3px}
.body p{margin:0;font-size:15px;font-weight:500;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.row.done .body p{color:var(--ink3);text-decoration:line-through;font-weight:400}
.empty{padding:34px 0;text-align:center;font-size:13.5px;color:var(--ink3);line-height:1.7}

.foot{margin-top:auto;padding-top:46px;text-align:center}
.foot button{font-size:12.5px;color:var(--ink3);padding:8px 12px}

/* 팝업 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:11;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);
  width:calc(100% - 40px);max-width:390px;background:#fff;border-radius:24px;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.14);
  opacity:0;pointer-events:none;transform:translate(-50%,14px);transition:opacity .2s ease,transform .22s ease}
.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.sh-head{background:#a9a9a9;color:#fff;text-align:center;font-size:15px;padding:17px 16px;font-weight:500}
.sh-body{padding:22px 22px 22px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.cat{height:38px;border-radius:12px;background:var(--soft);font-size:14px;color:var(--ink2)}
.cat.on{background:var(--dark);color:#fff}
.field{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px 14px;
  font:inherit;font-size:16px;color:var(--ink);outline:none;-webkit-appearance:none}
.field:focus{border-color:#bdbdbd}
textarea.field{height:150px;resize:none;font-size:14px;line-height:1.5;color:var(--ink2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.b{height:46px;border-radius:14px;font-size:15px}
.b.ghost{background:var(--soft);color:var(--ink2)}
.b.dark{background:var(--dark);color:#fff}
.hint{font-size:12.5px;color:var(--ink3);line-height:1.65;margin:0 0 12px}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);transform:translate(-50%,10px);
  background:var(--dark);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;z-index:20;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">

  <header class="head">
    <div class="ht"><b id="hdDate"></b><span id="hdDow"></span></div>
    <div class="nav">
      <button class="txt" id="goToday">오늘</button>
      <button class="ar" id="prev" aria-label="이전 달">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="ar" id="next" aria-label="다음 달">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </header>

  <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
  <div id="cal"></div>

  <section class="today">
    <div class="th">
      <h2 id="listTitle">오늘</h2>
      <button class="plus" id="add" aria-label="내용 추가">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
      </button>
    </div>
    <ul id="list"></ul>
  </section>

  <div class="foot"><button id="openBk">백업 · 불러오기</button></div>
</div>

<div class="scrim" id="scrim"></div>

<!-- 입력 팝업 -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="내용 입력">
  <div class="sh-head" id="shTitle"></div>
  <div class="sh-body">
    <div class="cats" id="cats">
      <button class="cat on" data-cat="todo">할일</button>
      <button class="cat" data-cat="plan">약속</button>
      <button class="cat" data-cat="meal">식사</button>
      <button class="cat" data-cat="memo">메모</button>
    </div>
    <input class="field" id="txt" type="text" maxlength="200" placeholder="내용을 입력하세요" autocomplete="off" enterkeyhint="done">
    <div class="btns">
      <button class="b ghost" id="shClose">닫기</button>
      <button class="b dark" id="shSave">등록</button>
    </div>
  </div>
</div>

<!-- 백업 팝업 -->
<div class="sheet" id="bk" role="dialog" aria-modal="true" aria-label="백업 및 불러오기">
  <div class="sh-head">백업 · 불러오기</div>
  <div class="sh-body">
    <p class="hint" id="bkInfo"></p>
    <textarea class="field" id="bkText" spellcheck="false"></textarea>
    <div class="btns">
      <button class="b ghost" id="bkCopy">백업 복사</button>
      <button class="b dark" id="bkLoad">불러오기</button>
    </div>
    <div class="btns" style="grid-template-columns:1fr;margin-top:10px">
      <button class="b ghost" id="bkClose">닫기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ---------- 기본 값 ---------- */
  var LS = 'todo-cal-v1';
  var LB = 'todo-cal-last-backup';
  var DOW = ['일','월','화','수','목','금','토'];
  var CAT_NAME = {todo:'할일', plan:'약속', meal:'식사', memo:'메모'};
  var SW = 68; // 밀었을 때 열리는 삭제 영역 너비

  var ICON = {
    todo:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/></svg>',
    todoDone:'<svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#2a2a2a"/><path d="M8.2 12.4l2.6 2.6 5-5.4" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    plan:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10.5h16M8.5 3.5V7M15.5 3.5V7"/></svg>',
    meal:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>',
    memo:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
    trash: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M18.5 7l-.8 12a2 2 0 0 1-2 1.9H8.3a2 2 0 0 1-2-1.9L5.5 7M9 7V4.5h6V7M10 11v6M14 11v6"/></svg>'
  };

  /* ---------- 데이터 ---------- */
  var data = { v:1, items:{} };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function keyOf(y,m,d){ return y+'-'+pad(m+1)+'-'+pad(d); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function load(){
    try{
      var r = localStorage.getItem(LS);
      if(r){ var d = clean(JSON.parse(r)); if(d) data = d; }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(LS, JSON.stringify(data)); }
    catch(e){ toast('저장에 실패했어요'); }
  }
  // 불러온 데이터가 올바른 모양인지 확인하고 정리
  function clean(d){
    if(!d || typeof d !== 'object' || !d.items || typeof d.items !== 'object') return null;
    var out = { v:1, items:{} };
    Object.keys(d.items).forEach(function(k){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(d.items[k])) return;
      var arr = d.items[k].filter(function(it){ return it && typeof it.text === 'string' && it.text.trim(); })
        .map(function(it){
          return {
            id: typeof it.id === 'string' ? it.id : uid(),
            cat: CAT_NAME[it.cat] ? it.cat : 'memo',
            text: it.text,
            done: it.done === true
          };
        });
      if(arr.length) out.items[k] = arr;
    });
    return out;
  }

  /* ---------- 상태 ---------- */
  var now = new Date();
  var todayKey = keyOf(now.getFullYear(), now.getMonth(), now.getDate());
  var vy = now.getFullYear(), vm = now.getMonth();   // 보고 있는 달
  var sel = todayKey;                                 // 선택한 날짜
  var editingId = null;
  var editCat = 'todo';

  function parseKey(k){ var p = k.split('-'); return {y:+p[0], m:+p[1]-1, d:+p[2]}; }
  function dayItems(k){ return data.items[k] || []; }

  /* ---------- 화면 그리기 ---------- */
  var $ = function(id){ return document.getElementById(id); };

  function renderHead(){
    var s = parseKey(sel);
    var dow = new Date(s.y, s.m, s.d).getDay();
    $('hdDate').textContent = s.y+'년 '+(s.m+1)+'월 '+s.d+'일';
    $('hdDow').textContent = DOW[dow]+'요일';
  }

  function renderCal(){
    var first = new Date(vy, vm, 1).getDay();
    var dim = new Date(vy, vm+1, 0).getDate();
    var cells = [], i;
    for(i=0;i<first;i++) cells.push(0);
    for(i=1;i<=dim;i++) cells.push(i);
    while(cells.length % 7) cells.push(0);

    var s = parseKey(sel);
    var selDay = (s.y === vy && s.m === vm) ? s.d : -1;
    var html = '';
    for(var w=0; w<cells.length; w+=7){
      var week = cells.slice(w, w+7);
      var on = selDay > 0 && week.indexOf(selDay) !== -1;
      html += '<div class="wk'+(on?' on':'')+'">';
      week.forEach(function(d){
        if(!d){ html += '<button class="d" disabled aria-hidden="true"></button>'; return; }
        var k = keyOf(vy, vm, d);
        var cls = 'd';
        if(k === todayKey) cls += ' is-today';
        if(k === sel) cls += ' sel';
        if(dayItems(k).length) cls += ' has';
        html += '<button class="'+cls+'" data-k="'+k+'" aria-label="'+(vm+1)+'월 '+d+'일"><span class="n">'+d+'</span><span class="dot"></span></button>';
      });
      html += '</div>';
    }
    $('cal').innerHTML = html;
  }

  function renderList(){
    var s = parseKey(sel);
    $('listTitle').textContent = sel === todayKey ? '오늘' : (s.m+1)+'월 '+s.d+'일';
    var items = dayItems(sel);
    if(!items.length){
      $('list').innerHTML = '<li class="empty">등록된 내용이 없어요<br>오른쪽 위 + 를 눌러 추가해 보세요</li>';
      openCard = null;
      return;
    }
    $('list').innerHTML = items.map(function(it){
      var isTodo = it.cat === 'todo';
      var ico = isTodo
        ? '<button class="ico chk" data-act="toggle" aria-label="완료 표시">'+(it.done?ICON.todoDone:ICON.todo)+'</button>'
        : '<span class="ico">'+ICON[it.cat]+'</span>';
      return '<li class="row'+(it.done?' done':'')+'" data-id="'+it.id+'">'+
        '<button class="delbtn" data-act="del" aria-label="삭제">'+ICON.trash+'</button>'+
        '<div class="card">'+ico+
          '<div class="body" data-act="edit"><small>'+CAT_NAME[it.cat]+'</small><p>'+esc(it.text)+'</p></div>'+
        '</div></li>';
    }).join('');
    openCard = null;
  }

  function renderAll(){ renderHead(); renderCal(); renderList(); }

  /* ---------- 달력 조작 ---------- */
  $('cal').addEventListener('click', function(e){
    var b = e.target.closest('.d[data-k]');
    if(!b) return;
    sel = b.getAttribute('data-k');
    renderAll();
  });

  function moveMonth(delta){
    vm += delta;
    if(vm < 0){ vm = 11; vy--; }
    if(vm > 11){ vm = 0; vy++; }
    var t = parseKey(todayKey);
    sel = (vy === t.y && vm === t.m) ? todayKey : keyOf(vy, vm, 1);
    renderAll();
  }
  $('prev').addEventListener('click', function(){ moveMonth(-1); });
  $('next').addEventListener('click', function(){ moveMonth(1); });
  $('goToday').addEventListener('click', function(){
    var t = parseKey(todayKey);
    vy = t.y; vm = t.m; sel = todayKey;
    renderAll();
  });

  /* ---------- 목록: 완료 / 수정 / 삭제 / 밀어서 삭제 ---------- */
  var openCard = null;
  var swiped = false;

  function setOpen(card, open){
    card.style.transform = open ? 'translateX(-'+SW+'px)' : '';
    if(open) openCard = card; else if(openCard === card) openCard = null;
  }
  function closeOpen(){ if(openCard) setOpen(openCard, false); }

  var sw = null;
  var list = $('list');

  list.addEventListener('pointerdown', function(e){
    var card = e.target.closest('.card');
    if(openCard && openCard !== card) closeOpen();
    if(!card) return;
    sw = { card:card, x0:e.clientX, y0:e.clientY, base: card === openCard ? -SW : 0, moved:false, x:0 };
  });
  list.addEventListener('pointermove', function(e){
    if(!sw) return;
    var dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
    if(!sw.moved){
      if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){
        sw.moved = true;
        sw.card.style.transition = 'none';
        try{ sw.card.setPointerCapture(e.pointerId); }catch(err){}
      } else return;
    }
    sw.x = Math.min(0, Math.max(-SW, sw.base + dx));
    sw.card.style.transform = 'translateX('+sw.x+'px)';
  });
  function endSwipe(){
    if(!sw) return;
    if(sw.moved){
      sw.card.style.transition = '';
      setOpen(sw.card, sw.x < -SW/2);
      swiped = true;
      setTimeout(function(){ swiped = false; }, 60);
    }
    sw = null;
  }
  list.addEventListener('pointerup', endSwipe);
  list.addEventListener('pointercancel', endSwipe);

  list.addEventListener('click', function(e){
    if(swiped) return;
    var row = e.target.closest('.row');
    if(!row) return;
    var id = row.getAttribute('data-id');
    var actEl = e.target.closest('[data-act]');
    var act = actEl ? actEl.getAttribute('data-act') : '';

    if(act === 'del'){
      data.items[sel] = dayItems(sel).filter(function(it){ return it.id !== id; });
      if(!data.items[sel].length) delete data.items[sel];
      save(); renderCal(); renderList();
      return;
    }
    if(openCard){ closeOpen(); return; }
    if(act === 'toggle'){
      dayItems(sel).forEach(function(it){ if(it.id === id) it.done = !it.done; });
      save(); renderList();
      return;
    }
    if(act === 'edit'){ openEdit(id); }
  });

  /* ---------- 입력 팝업 ---------- */
  var scrim = $('scrim'), sheet = $('sheet'), bk = $('bk');

  function showSheet(el){ scrim.classList.add('on'); el.classList.add('on'); }
  function hideAll(){
    scrim.classList.remove('on'); sheet.classList.remove('on'); bk.classList.remove('on');
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  function setCat(c){
    editCat = c;
    Array.prototype.forEach.call(document.querySelectorAll('.cat'), function(b){
      b.classList.toggle('on', b.getAttribute('data-cat') === c);
    });
  }
  $('cats').addEventListener('click', function(e){
    var b = e.target.closest('.cat'); if(b) setCat(b.getAttribute('data-cat'));
  });

  function sheetTitle(){
    var s = parseKey(sel);
    return s.y+'년 '+(s.m+1)+'월 '+s.d+'일 '+DOW[new Date(s.y,s.m,s.d).getDay()]+'요일';
  }

  function openAdd(){
    editingId = null;
    $('shTitle').textContent = sheetTitle();
    $('shSave').textContent = '등록';
    $('txt').value = '';
    setCat('todo');
    showSheet(sheet);
    setTimeout(function(){ $('txt').focus(); }, 80);
  }
  function openEdit(id){
    var it = dayItems(sel).filter(function(x){ return x.id === id; })[0];
    if(!it) return;
    editingId = id;
    $('shTitle').textContent = sheetTitle();
    $('shSave').textContent = '수정';
    $('txt').value = it.text;
    setCat(it.cat);
    showSheet(sheet);
    setTimeout(function(){ $('txt').focus(); }, 80);
  }

  function submit(){
    var text = $('txt').value.trim();
    if(!text){
      var f = $('txt'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); f.focus();
      return;
    }
    if(!data.items[sel]) data.items[sel] = [];
    if(editingId){
      data.items[sel].forEach(function(it){
        if(it.id === editingId){ it.text = text; it.cat = editCat; if(editCat !== 'todo') it.done = false; }
      });
    } else {
      data.items[sel].push({ id:uid(), cat:editCat, text:text, done:false });
    }
    save(); hideAll(); renderCal(); renderList();
  }

  $('add').addEventListener('click', openAdd);
  $('shSave').addEventListener('click', submit);
  $('shClose').addEventListener('click', hideAll);
  $('txt').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
  scrim.addEventListener('click', hideAll);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') hideAll(); });

  /* ---------- 백업 / 불러오기 ---------- */
  function lastBackupText(){
    var t = null;
    try{ t = localStorage.getItem(LB); }catch(e){}
    if(!t) return '아직 백업한 적이 없어요.';
    var d = new Date(+t);
    return '마지막 백업: '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function openBackup(){
    $('bkText').value = JSON.stringify(data);
    $('bkInfo').innerHTML = '‘백업 복사’를 누른 뒤 메모 앱 등에 붙여넣어 보관하세요.<br>복구할 때는 위 칸에 붙여넣고 ‘불러오기’를 누르세요.<br>'+lastBackupText();
    showSheet(bk);
  }
  $('openBk').addEventListener('click', openBackup);
  $('bkClose').addEventListener('click', hideAll);

  $('bkCopy').addEventListener('click', function(){
    var ta = $('bkText');
    ta.value = JSON.stringify(data);
    var done = function(){
      try{ localStorage.setItem(LB, String(Date.now())); }catch(e){}
      $('bkInfo').innerHTML = $('bkInfo').innerHTML.replace(/(마지막 백업|아직 백업한 적이).*$/, lastBackupText());
      toast('복사했어요');
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(done, function(){ fallbackCopy(ta, done); });
    } else fallbackCopy(ta, done);
  });
  function fallbackCopy(ta, done){
    try{
      ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
      if(document.execCommand('copy')) done(); else toast('길게 눌러서 직접 복사해 주세요');
    }catch(e){ toast('길게 눌러서 직접 복사해 주세요'); }
  }

  $('bkLoad').addEventListener('click', function(){
    var raw = $('bkText').value.trim();
    var parsed = null;
    try{ parsed = clean(JSON.parse(raw)); }catch(e){}
    if(!parsed){ toast('백업 내용을 읽을 수 없어요'); return; }
    if(!confirm('지금 저장된 내용이 모두 백업 내용으로 바뀝니다.\n불러올까요?')) return;
    data = parsed;
    save(); hideAll(); renderAll();
    toast('불러왔어요');
  });

  /* ---------- 토스트 ---------- */
  var tt;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, 1800);
  }

  /* ---------- 자정이 지나면 오늘 날짜 갱신 ---------- */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) return;
    var n = new Date();
    var k = keyOf(n.getFullYear(), n.getMonth(), n.getDate());
    if(k !== todayKey){
      todayKey = k; vy = n.getFullYear(); vm = n.getMonth(); sel = k;
      renderAll();
    }
  });

  /* ---------- 홈 화면 아이콘 (직접 그려서 설정) ---------- */
  try{
    var c = document.createElement('canvas'); c.width = c.height = 180;
    var g = c.getContext('2d');
    g.fillStyle = '#2a2a2a'; g.fillRect(0,0,180,180);
    g.strokeStyle = '#ffffff'; g.lineWidth = 11; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(54,93); g.lineTo(80,119); g.lineTo(128,65); g.stroke();
    var l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
    document.head.appendChild(l);
  }catch(e){}

  // 브라우저가 저장 공간을 임의로 지우지 않도록 요청 (지원하는 경우)
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

  load();
  renderAll();
})();
</script>
</body>
</html>
